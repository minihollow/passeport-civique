# Builds the Windows package and attaches it to each published GitHub Release.
name: Windows package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: node scripts/build.mjs
      - run: gh release upload "${{ github.event.release.tag_name }}" out/Passeport-civique-Windows.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
